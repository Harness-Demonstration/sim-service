asyncapi: 3.1.0
info:
  title: sim-service events
  version: 1.0.0
  description: Messages sim-service consumes and publishes. Change this file before the Java code.
channels:
  simOrdered:
    address: sim.ordered
    messages:
      SimOrdered:
        $ref: '#/components/messages/SimOrdered'
  simOrderedDeadLetter:
    address: sim.ordered.dlt
    messages:
      SimOrderedDeadLetter:
        $ref: '#/components/messages/SimOrderedDeadLetter'
  simActivated:
    address: sim.activated
    messages:
      SimActivated:
        $ref: '#/components/messages/SimActivated'
  simDeactivated:
    address: sim.deactivated
    messages:
      SimDeactivated:
        $ref: '#/components/messages/SimDeactivated'
operations:
  receiveSimOrdered:
    action: receive
    channel:
      $ref: '#/channels/simOrdered'
  publishSimOrderedDeadLetter:
    action: send
    channel:
      $ref: '#/channels/simOrderedDeadLetter'
  publishSimActivated:
    action: send
    channel:
      $ref: '#/channels/simActivated'
  publishSimDeactivated:
    action: send
    channel:
      $ref: '#/channels/simDeactivated'
components:
  messages:
    SimOrdered:
      payload:
        type: object
        required: [iccid, msisdn, orderId]
        properties:
          iccid: {type: string, pattern: '^[0-9]{19,20}$'}
          msisdn: {type: string, pattern: '^[1-9][0-9]{0,14}$'}
          orderId: {type: string}
    SimOrderedDeadLetter:
      contentType: application/octet-stream
      description: >
        Original sim.ordered value bytes and key, unchanged (including a null value).
        Spring Kafka's dead-letter publisher writes it and may add its own kafka_dlt-* headers.
        Delivery is at least once; eventId is new for every dead-letter publish, so a record
        published again after a consumer restart has a different eventId.
      headers:
        type: object
        required: [reason, eventId]
        properties:
          reason: {type: string, description: UTF-8 explanation of the rejection.}
          eventId: {type: string, format: uuid, description: UTF-8 identifier of this dead-letter publish.}
      payload:
        description: Original Kafka value bytes, which may not be valid JSON or UTF-8, or may be null.
    SimActivated:
      payload:
        type: object
        additionalProperties: false
        required: [eventId, iccid, msisdn, activatedAt]
        properties:
          eventId: {type: string, format: uuid, description: Same value on a redelivery; consumers drop duplicates by it.}
          iccid: {type: string}
          msisdn: {type: string}
          activatedAt: {type: string, format: date-time}
    SimDeactivated:
      payload:
        type: object
        additionalProperties: false
        required: [eventId, iccid, msisdn, deactivatedAt]
        properties:
          eventId: {type: string, format: uuid, description: Same value on a redelivery; consumers drop duplicates by it.}
          iccid: {type: string}
          msisdn: {type: string}
          deactivatedAt: {type: string, format: date-time}
