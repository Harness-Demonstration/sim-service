name: Copilot Setup Steps

# GitHub runs this job before the Copilot coding agent starts.
# The file name and the job name "copilot-setup-steps" are fixed by GitHub.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Download Maven dependencies
        run: ./mvnw -q -B dependency:go-offline
