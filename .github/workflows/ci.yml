name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B verify

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-docs.sh

  generated-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: scripts/generate-docs.sh
      - name: Committed docs/generated must equal a fresh generation
        run: git diff --exit-code -- docs/generated || (echo "::error::docs/generated is out of date. FIX: run scripts/generate-docs.sh and commit the result; never edit it by hand." && exit 1)
